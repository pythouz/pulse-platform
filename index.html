<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — منصة المحتوى والأدوات الذكية المفتوحة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght=0,300;0,400;0,600;1,300;1,400&family=Cairo:wght=300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --off-white: #F8F5F0;
      --warm-cream: #F2EDE4;
      --soft-beige: #E8E0D5;
      --ink: #1A1A1A;
      --ink-soft: #3D3530;
      --ink-muted: #6B5E55;
      --ink-faint: #9C8E85;
      --accent-rust: #C0392B;
      --accent-sage: #4A7C59;
      --border: #D9D0C5;
      --border-light: #EAE4DB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--off-white); color: var(--ink); font-family: 'Cairo', sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .site-header { background: var(--off-white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--ink); }
    .logo span { color: var(--accent-rust); font-style: italic; }

    .main-grid { display: grid; grid-template-columns: 280px 1fr 280px; max-width: 1300px; margin: 0 auto; }
    .col-sidebar { border-left: 1px solid var(--border); height: calc(100vh - 57px); position: sticky; top: 57px; overflow-y: auto; padding: 1.5rem 1.25rem; }
    .col-feed { border-left: 1px solid var(--border); padding: 2rem 2.25rem; }
    .col-profile { height: calc(100vh - 57px); position: sticky; top: 57px; overflow-y: auto; padding: 1.5rem 1.25rem; }

    .section-label { font-size: 0.72rem; font-weight: 600; color: var(--ink-faint); margin-bottom: 0.85rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-light); letter-spacing: 0.05em; }

    .community-item { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.6rem; border-radius: 6px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; }
    .community-item:hover { background: var(--warm-cream); }
    .community-item.active { background: var(--soft-beige); }
    .community-name { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }

    .article-card { border-bottom: 1px solid var(--border-light); padding: 2rem 0; }
    .article-card:first-child { padding-top: 0; }
    .article-meta { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; }
    .author-avatar { width: 28px; height: 28px; border-radius: 50%; }
    .author-name { font-size: 0.82rem; font-weight: 600; color: var(--ink-soft); }
    .article-date { font-size: 0.75rem; color: var(--ink-faint); }
    .article-tag { margin-right: auto; font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 3px; background: var(--warm-cream); color: var(--ink-muted); border: 1px solid var(--border); }
    .article-title { font-size: 1.35rem; font-weight: 700; line-height: 1.4; color: var(--ink); margin-bottom: 0.6rem; }
    .article-excerpt { font-family: 'Source Serif 4', serif; font-size: 0.98rem; line-height: 1.75; color: var(--ink-muted); margin-bottom: 1.25rem; white-space: pre-wrap; }

    .profile-card { text-align: center; padding-bottom: 1.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 0.85rem; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; color: white; background: var(--ink-muted); }
    .profile-name { font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-bottom: 0.2rem; }
    .profile-handle { font-size: 0.75rem; color: var(--ink-faint); margin-bottom: 0.6rem; direction: ltr; }
    .profile-bio { font-size: 0.85rem; line-height: 1.6; color: var(--ink-muted); margin-bottom: 0.85rem; }
    .profile-stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 0.9rem; }
    .stat-number { font-size: 1rem; font-weight: 700; color: var(--ink); }
    .stat-label { font-size: 0.68rem; color: var(--ink-faint); }

    .subscribe-btn { width: 100%; padding: 0.6rem; background: var(--ink); color: var(--off-white); border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .subscribe-btn:hover { background: var(--accent-rust); }
    .subscribe-btn.subscribed { background: transparent; color: var(--ink); border: 1px solid var(--border); }

    .tool-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border-light); }
    .tool-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.3rem; }
    .tool-name { font-size: 0.88rem; font-weight: 600; color: var(--accent-rust); }
    .tool-desc { font-size: 0.8rem; color: var(--ink-muted); line-height: 1.4; }
    .run-tool-btn { padding: 0.25rem 0.6rem; background: transparent; border: 1px solid var(--border); border-radius: 4px; font-size: 0.72rem; color: var(--ink-muted); cursor: pointer; }
    .run-tool-btn:hover { background: var(--ink); color: white; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(26,26,26,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-box { background: var(--off-white); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem 2rem; width: 460px; max-width: 95vw; }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }

    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--off-white); padding: 0.6rem 1.2rem; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: all 0.25s; z-index: 200; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="site-header">
    <div style="max-width:1300px; margin:0 auto; padding:0 1.5rem; height:57px; display:flex; align-items:center; justify-content:space-between;">
      <div class="logo">Pulse<span>.</span></div>
      <span style="font-size:0.8rem; color:var(--ink-faint);">منصة اجتماعية عامة مدعومة بالكامل بـ GitHub</span>
    </div>
  </header>

  <div class="main-grid">
    <aside class="col-sidebar">
      <div class="section-label">المجتمعات العامة</div>
      <div class="community-item active"><span class="community-name">🎯 الحوار العام والنقاشات</span></div>
      <div class="community-item"><span class="community-name">📊 المال والأعمال والأتمتة</span></div>
      <div class="community-item"><span class="community-name">✍️ المقالات والقصص الثقافية</span></div>
    </aside>

    <main class="col-feed">
      <div id="live-post-form-container"></div>
      <div class="section-label">آخر النشرات والمنشورات الحية</div>
      <div id="feed-container">جاري جلب المنشورات الحية من GitHub...</div>
    </main>

    <aside class="col-profile">
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GITHUB_API = 'https://api.github.com';
    const PLATFORM_REPO = 'pythouz/pulse-platform'; // ريبو المنصة المركزي الخاص بك

    let currentUser = JSON.parse(localStorage.getItem('pulseUser') || 'null');
    let githubToken = localStorage.getItem('pulseGithubToken') || '';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function initAuthenticationUI() {
      const profileColumn = document.querySelector('.col-profile');
      profileColumn.innerHTML = `
        <div id="dynamic-profile-root"></div>
        <div class="section-label mt-6">أدواتك (تطبيقاتك المصغرة)</div>
        <div id="tools-list"></div>

        <div class="modal-overlay" id="github-login-modal" onclick="closeGithubModal()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">ربط حساب GitHub</div>
            <p style="font-size:.82rem; color:var(--ink-muted); line-height:1.6; margin-bottom:1rem;">
              أدخل اسم مستخدم جيت هب والـ Personal Access Token (PAT). التوكن يتم حفظه في متصفحك محلياً فقط (Local Storage) لإعطائك صلاحية النشر وإضافة الأدوات بأمان.
            </p>
            <input id="github-username" type="text" placeholder="اسم المستخدم (Username)" style="width:100%; padding:.6rem; border:1px solid var(--border); border-radius:6px; margin-bottom:.5rem; background:white;" />
            <input id="github-token" type="password" placeholder="GitHub Personal Access Token" style="width:100%; padding:.6rem; border:1px solid var(--border); border-radius:6px; margin-bottom:1rem; background:white;" />
            <button onclick="loginWithGithub()" style="width:100%; padding:.6rem; background:var(--ink); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">تأكيد الربط وتسجيل الدخول</button>
          </div>
        </div>
      `;

      if (currentUser) {
        renderGithubProfile(currentUser);
        fetchUserRepos();
      } else {
        renderLoginCard();
      }
    }

    function renderLoginCard() {
      document.getElementById('dynamic-profile-root').innerHTML = `
        <div class="profile-card">
          <div class="profile-avatar">P</div>
          <div class="profile-name">مستخدم زائر</div>
          <div class="profile-bio">سجل دخولك عبر جيت هب لتتمكن من النشر ومشاركة أدواتك المصغرة مع الجميع ببلاش 100%.</div>
          <button class="subscribe-btn" onclick="openGithubModal()">تسجيل الدخول عبر GitHub</button>
        </div>
      `;
      document.getElementById('live-post-form-container').innerHTML = '';
    }

    function openGithubModal() { document.getElementById('github-login-modal').classList.add('open'); }
    function closeGithubModal() { document.getElementById('github-login-modal').classList.remove('open'); }

    async function loginWithGithub() {
      const username = document.getElementById('github-username').value.trim();
      const token = document.getElementById('github-token').value.trim();

      if (!username || !token) { showToast('من فضلك املأ البيانات المطلوبة'); return; }

      try {
        const res = await fetch(`${GITHUB_API}/users/${username}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error('بيانات غير صحيحة');
        
        const userData = await res.json();
        localStorage.setItem('pulseGithubToken', token);
        localStorage.setItem('pulseUser', JSON.stringify(userData));

        githubToken = token;
        currentUser = userData;

        closeGithubModal();
        renderGithubProfile(userData);
        fetchUserRepos();
        fetchLiveFeed(); // إعادة تحميل الفيد فوراً بالتوكن الجديد
        showToast(`مرحباً بك يا ${userData.name || userData.login} في Pulse ✨`);
      } catch (err) {
        showToast('تعذر تسجيل الدخول، تأكد من صحة التوكن واسم المستخدم');
      }
    }

    function logoutGithub() {
      localStorage.removeItem('pulseGithubToken');
      localStorage.removeItem('pulseUser');
      currentUser = null; githubToken = '';
      renderLoginCard();
      document.getElementById('tools-list').innerHTML = '';
      fetchLiveFeed(); // لتحديث الفيد كزائر
      showToast('تم تسجيل الخروج بنجاح');
    }

    function renderGithubProfile(user) {
      document.getElementById('dynamic-profile-root').innerHTML = `
        <div class="profile-card">
          <img src="${user.avatar_url}" class="profile-avatar" style="object-fit:cover;" />
          <div class="profile-name">${user.name || user.login}</div>
          <div class="profile-handle">@${user.login}</div>
          <div class="profile-bio">${user.bio || 'لا يوجد وصف مضاف للحساب الشخصي.'}</div>
          <div class="profile-stats">
            <div><div class="stat-number">${user.followers}</div><div class="stat-label">متابع</div></div>
            <div><div class="stat-number">${user.public_repos}</div><div class="stat-label">ريبو</div></div>
          </div>
          <button class="subscribe-btn subscribed" onclick="logoutGithub()">تسجيل الخروج</button>
        </div>
      `;
      renderCreatePostForm();
    }

    function renderCreatePostForm() {
      document.getElementById('live-post-form-container').innerHTML = `
        <div style="background:var(--warm-cream); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:2rem;">
          <div style="font-weight:700; margin-bottom:1rem; font-size:1rem;">✍️ انشر مقالاً أو تحديثاً جديداً للجميع</div>
          <input id="post-title" type="text" placeholder="عنوان المنشور المميز..." style="width:100%; padding:.6rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.5rem; background:white; font-family:'Cairo';" />
          <textarea id="post-content" placeholder="اكتب فكرتك أو مقالك هنا بالكامل..." style="width:100%; height:120px; padding:.6rem; border:1px solid var(--border); border-radius:8px; margin-bottom:1rem; background:white; font-family:'Cairo';"></textarea>
          <button onclick="publishPost()" style="padding:.6rem 1.5rem; background:var(--ink); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-family:'Cairo'; text-align:center;">نشر فوري عبر جيت هب 🚀</button>
        </div>
      `;
    }

    async function publishPost() {
      const title = document.getElementById('post-title').value.trim();
      const body = document.getElementById('post-content').value.trim();

      if (!title || !body) { showToast('برجاء كتابة عنوان ومحتوى البوست أولاً'); return; }

      try {
        const res = await fetch(`${GITHUB_API}/repos/${PLATFORM_REPO}/issues`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `token ${githubToken}`
          },
          body: JSON.stringify({ title, body })
        });

        if (!res.ok) throw new Error('فشل النشر');

        showToast('تم نشر موضوعك بنجاح وجاري إضافته للتايم لاين لايف! ✨');
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        setTimeout(fetchLiveFeed, 1000); // إعطاء جيت هب ثانية لجدولة الـ Issue الجديدة
      } catch (err) {
        showToast('خطأ أثناء النشر، تأكد من تفعيل صلاحيات الـ Issues في التوكن الخاص بك');
      }
    }

    async function fetchLiveFeed() {
      try {
        const headers = {};
        if (githubToken) {
          headers['Authorization'] = `token ${githubToken}`;
        }

        const res = await fetch(`${GITHUB_API}/repos/${PLATFORM_REPO}/issues?state=open&sort=created&direction=desc`, { headers });
        if (!res.ok) throw new Error();
        const issues = await res.json();

        const posts = issues.filter(i => !i.pull_request).map(i => ({
          id: i.id,
          author: i.user.login,
          authorAvatar: i.user.avatar_url,
          date: new Date(i.created_at).toLocaleDateString('ar-EG'),
          tag: 'منشور حي',
          title: i.title,
          excerpt: i.body || 'لا يوجد محتوى لهذا المنشور.'
        }));

        renderDynamicFeed(posts);
      } catch (err) {
        document.getElementById('feed-container').innerHTML = `
          <div style="padding:1rem; background:#FEF2F2; border:1px solid #FCA5A5; color:#991B1B; border-radius:8px; font-size:0.85rem; line-height:1.6;">
            ⚠️ <b>تعذر جلب البيانات الحية فوراً من المستودع</b><br>
            جيت هب يتطلب تفعيل خاصية الـ Issues داخل المستودع المركزي الخاص بك للتمكن من استخدامه كقاعدة بيانات للمنشورات.<br><br>
            <b>خطوات الحل الفوري في دقيقة:</b><br>
            1. اذهب لصفحة ريبو المنصة عندك: <a href="https://github.com/${PLATFORM_REPO}/settings" target="_blank" style="text-decoration:underline; font-weight:bold;">GitHub Repo Settings</a><br>
            2. في تبويب <b>General</b>، انزل لأسفل حتى تصل لجزء يسمى <b>Features</b>.<br>
            3. قم بوضع علامة صح بجانب خيار <b>Issues</b> لتفعيلها.<br>
            4. أعد تحديث (Refresh) هذه الصفحة وسيعمل كل شيء فوراً وبأقصى سرعة!
          </div>`;
      }
    }

    function renderDynamicFeed(posts) {
      const container = document.getElementById('feed-container');
      if (posts.length === 0) {
        container.innerHTML = '<p style="font-size:0.9rem; color:var(--ink-muted); text-align:center; padding:2rem 0;">لا توجد منشورات حية بعد، كن أول من ينشر في المنصة!</p>';
        return;
      }
      container.innerHTML = posts.map(post => `
        <div class="article-card">
          <div class="article-meta">
            <img src="${post.authorAvatar}" class="author-avatar" />
            <span class="author-name">${post.author}</span>
            <span class="article-date">${post.date}</span>
            <span class="article-tag">${post.tag}</span>
          </div>
          <div class="article-title">${post.title}</div>
          <div class="article-excerpt">${post.excerpt}</div>
        </div>
      `).join('');
    }

    async function fetchUserRepos() {
      if (!currentUser) return;
      try {
        const headers = {};
        if (githubToken) headers['Authorization'] = `token ${githubToken}`;

        const res = await fetch(`${GITHUB_API}/users/${currentUser.login}/repos?sort=updated`, { headers });
        const repos = await res.json();

        if(!Array.isArray(repos)) throw new Error();

        document.getElementById('tools-list').innerHTML = repos.slice(0, 5).map(repo => `
          <div class="tool-item">
            <div class="tool-header">
              <span class="tool-name">${repo.name}</span>
              <button class="run-tool-btn" onclick="convertRepoToMicroApp('${repo.name}')">تحويل لأداة ⚡</button>
            </div>
            <div class="tool-desc">${repo.description || 'ريبو متاح للتحويل لتطبيق مصغر داخل المنصة.'}</div>
          </div>
        `).join('');
      } catch (err) { 
        document.getElementById('tools-list').innerHTML = '<p style="font-size:0.8rem; color:var(--ink-faint);">تعذر جلب مستودعاتك الشخصية، تأكد من صلاحية التوكن.</p>';
      }
    }

    async function convertRepoToMicroApp(repoName) {
      const desc = prompt('اكتب وصفاً أو طريقة تشغيل الأداة للمستخدم العادي:');
      if (!desc) return;

      try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify({
          repo: repoName, description: desc, platform: 'Pulse', addedAt: new Date().toISOString()
        }, null, 2))));

        const res = await fetch(`${GITHUB_API}/repos/${currentUser.login}/${repoName}/contents/pulse-microapp.json`, {
          method: 'PUT',
          headers: { Authorization: `token ${githubToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Activate Pulse Micro-app Configuration', content })
        });

        if (!res.ok) throw new Error();
        showToast(`تم تفعيل الـ Manifest وتحويل ${repoName} لأداة بنجاح! ✨`);
      } catch (err) {
        showToast('تعذر حفظ الملف، تحقق من صلاحيات التوكن للريبو الشخصي');
      }
    }

    window.addEventListener('load', () => {
      initAuthenticationUI();
      fetchLiveFeed();
    });
  </script>
</body>
</html>
